services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: newsfeed-postgres-vector
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newsfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d newsfeed"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
spring:
  application:
    name: newsfeed-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/newsfeed
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      # Any OpenAI-compatible endpoint, set through environment variables (see README):
      # OpenAI API by default, or a local Ollama (AI_BASE_URL=http://localhost:11434/v1).
      api-key: ${OPENAI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      chat:
        # base-url already ends with /v1
        completions-path: /chat/completions
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
      embedding:
        # base-url already ends with /v1
        embeddings-path: /embeddings
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
          # Must match the vector store dimensions below (nomic-embed-text in Ollama is also 768)
          dimensions: 768

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health, info